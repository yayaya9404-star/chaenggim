<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>챙김</title>
<meta name="theme-color" content="#2F5D50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F5F3EE; --surface:#FFFFFF; --surface2:#FAF9F6; --ink:#1E2124; --muted:#6C7077; --faint:#A3A7AD;
  --line:#E6E2D9; --accent:#2F5D50; --accent-ink:#FFFFFF; --accent-soft:#E3EDE9;
  --danger:#D1453B; --danger-soft:#FBE9E7; --warn:#B7791F; --star:#E8A317;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141516; --surface:#1D1E20; --surface2:#232427; --ink:#ECECEA; --muted:#A0A3A8; --faint:#6E7177;
    --line:#2E3033; --accent:#6FB39C; --accent-ink:#0E1A16; --accent-soft:#1F2E29;
    --danger:#F0716A; --danger-soft:#3A2220; --warn:#E0A84A; --star:#F2B630;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{flex-shrink:0}
.hidden{display:none!important}

/* layout */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);height:100vh}
.main{min-width:0}
.side{border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto;background:var(--surface2)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.brand img{width:28px;height:28px;border-radius:8px}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0}
.btn-new{display:flex;align-items:center;gap:8px;justify-content:center;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px;font-weight:600;margin-bottom:12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-align:left;width:100%}
.nav-item:hover{background:var(--line)}
.nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item .cnt.red{color:var(--danger);font-weight:700}
.side h4{margin:18px 10px 6px;font-size:11.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.side h4 button{color:var(--muted);font-size:12px;font-weight:500}
.side h4 button:hover{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,#999);flex-shrink:0}
.side .foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:2px}
.who{font-size:12px;color:var(--muted);padding:6px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{overflow:auto;padding:28px 40px 120px}
.main-inner{max-width:860px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h1{font-size:26px;margin:0;letter-spacing:-.03em}
.head .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.filter-tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.filter-tag button{color:var(--muted)}

/* quick add */
.quick{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 6px 6px 14px;box-shadow:var(--shadow);margin-bottom:22px}
.quick input[type=text]{flex:1;border:0;outline:0;background:transparent;padding:8px 0;min-width:0}
.quick select{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 8px;font-size:13px;max-width:120px}
.quick .go{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}

/* groups & tasks */
.group{margin-bottom:22px}
.group-h{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px 2px}
.group-h.red{color:var(--danger)}
.group-h .n{font-weight:500}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-top:1px solid var(--line);position:relative}
.task:first-child{border-top:0}
.task:hover{background:var(--surface2)}
.task.imp::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--star)}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--c,#999);margin-top:1px;display:grid;place-items:center;transition:.15s}
.check:hover{background:color-mix(in srgb,var(--c) 18%,transparent)}
.task.done .check{background:var(--c);}
.task.done .check::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttitle{font-weight:500;word-break:break-word;display:flex;gap:6px;align-items:center}
.task.done .ttitle{color:var(--faint);text-decoration:line-through}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);margin-top:3px;align-items:center}
.tmeta span{display:inline-flex;align-items:center;gap:4px}
.tmeta .over{color:var(--danger);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px 1px 7px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* calendar */
.cal-bar{display:flex;align-items:center;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{background:var(--surface2)}
.txt-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-wd{font-size:12px;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line);font-weight:600}
.cal-wd:first-child{color:var(--danger)}
.cal-wd:last-child{color:#3E63DD}
.cal-day{min-height:104px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.cal-day:nth-child(7n+1){border-left:0}
.cal-day.dim{background:var(--surface2)}
.cal-day.dim .num{color:var(--faint)}
.cal-day:hover{background:var(--accent-soft)}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day .num{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal-day.sun .num{color:var(--danger)}
.cal-day.sat .num{color:#3E63DD}
.cal-day.today .num{background:var(--accent);color:var(--accent-ink)}
.chip{font-size:11.5px;line-height:1.35;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done{opacity:.45;text-decoration:line-through}
.chip.imp{font-weight:700}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap;padding-left:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.day-panel{margin-top:20px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,18,20,.42);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;animation:pop .18s}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.modal-h h2{margin:0;font-size:18px;letter-spacing:-.02em}
.modal-b{padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface2);position:sticky;bottom:0}
.modal-f .sp{flex:1}
.field label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:9px 11px;outline:0}
.inp:focus{border-color:var(--accent);background:var(--surface)}
textarea.inp{resize:vertical;min-height:64px}
.title-inp{font-size:17px;font-weight:600;border:0;background:transparent;padding:4px 0;border-bottom:2px solid var(--line);border-radius:0}
.title-inp:focus{border-color:var(--accent);background:transparent}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.cat-pick{display:flex;flex-wrap:wrap;gap:6px}
.cat-pick button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;background:var(--surface)}
.cat-pick button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--surface)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.toggle input{display:none}
.toggle .sw{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:.15s;flex-shrink:0}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked+.sw{background:var(--accent)}
.toggle input:checked+.sw::after{left:19px}
.btn{border-radius:9px;padding:9px 16px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px}
.hint{font-size:12.5px;color:var(--muted)}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:14.5px}

/* alert */
.alert-ov{position:fixed;inset:0;background:rgba(10,12,14,.6);display:grid;place-items:center;z-index:80;padding:16px}
.alert{background:var(--surface);border-radius:20px;width:min(460px,100%);box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden;animation:ring .5s}
@keyframes ring{0%{transform:scale(.9);opacity:0}50%{transform:scale(1.02)}}
.alert-top{background:var(--danger);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:12px}
.alert-top b{font-size:19px;display:block}
.alert-top small{opacity:.85}
.alert-item{padding:16px 22px;border-bottom:1px solid var(--line)}
.alert-item .t{font-size:17px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.alert-item .m{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.alert-acts{display:flex;gap:6px;flex-wrap:wrap}

/* summary */
.sum-hero{padding:24px 22px 8px}
.sum-hero .d{color:var(--muted);font-size:13.5px}
.sum-hero h2{margin:4px 0 0;font-size:22px;letter-spacing:-.03em}
.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 22px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.red b{color:var(--danger)}
.sum-sec{padding:6px 22px 4px}
.sum-sec h4{margin:10px 0 6px;font-size:13px;color:var(--muted)}
.sum-sec h4.red{color:var(--danger)}
.sum-li{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14.5px;border-bottom:1px dashed var(--line)}
.sum-li:last-child{border-bottom:0}
.sum-li .w{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}

/* cat manager */
.cat-row{display:flex;gap:8px;align-items:center}
.cat-row input[type=text]{flex:1}
.cat-row .mv{display:flex;flex-direction:column;gap:2px}
.cat-row .mv button{width:24px;height:17px;border-radius:5px;border:1px solid var(--line);background:var(--surface2);font-size:9px;line-height:1;color:var(--muted)}
.cat-row .mv button:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.cat-row .mv button:disabled{opacity:.3;cursor:default}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches button{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid transparent}
.swatches button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;font-size:24px;display:flex;align-items:center;gap:10px}
.login img{width:36px;height:36px;border-radius:10px}
.err{color:var(--danger);font-size:13px;min-height:18px}

/* toast */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);pointer-events:auto;display:flex;gap:12px;align-items:center;animation:pop .2s}
.toast button{color:var(--accent);font-weight:700;filter:brightness(1.6)}
.demo-bar{background:#FFF4D6;color:#6B4E00;font-size:12.5px;padding:6px 12px;text-align:center}
@media (prefers-color-scheme: dark){.demo-bar{background:#3A3016;color:#F2D58A}}

/* ---------- 꾸미기: 배경 ---------- */
#bgLayer,#bgWash{position:fixed;inset:0;z-index:-2;pointer-events:none}
#bgWash{z-index:-1;background:var(--bg);opacity:0}
body.has-bg{background:transparent}
body.has-bg .side{background:color-mix(in srgb,var(--surface) 74%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
body.has-bg .head{background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
body.has-bg .group-h{display:inline-flex;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:3px 11px;border-radius:999px}
body.has-bg .main{scrollbar-color:color-mix(in srgb,var(--ink) 30%,transparent) transparent}

/* ---------- 꾸미기: 스티커 ---------- */
#stickers{position:fixed;inset:0;z-index:35;pointer-events:none;overflow:hidden}
.stk{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));line-height:1;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18));touch-action:none}
.stk img{width:100%;height:auto;display:block;pointer-events:none;-webkit-user-drag:none}
.stk .del,.stk .rsz{display:none}
body.decorating #stickers{pointer-events:auto;background:color-mix(in srgb,var(--accent) 6%,transparent)}
body.decorating .stk{cursor:grab;outline:2px dashed var(--accent);outline-offset:5px;border-radius:6px}
body.decorating .stk:active{cursor:grabbing}
body.decorating .stk .del{display:grid;place-items:center;position:absolute;top:-16px;right:-16px;width:24px;height:24px;border-radius:50%;background:var(--danger);color:#fff;font-size:15px;font-weight:700;line-height:1;cursor:pointer;font-family:sans-serif}
body.decorating .stk .rsz{display:block;position:absolute;right:-14px;bottom:-14px;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #fff;cursor:nwse-resize;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.deco-bar{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:46;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13.5px;max-width:calc(100% - 24px)}
.deco-bar .btn{border:0}
.deco-bar .btn:not(.primary){background:color-mix(in srgb,var(--bg) 20%,transparent);color:var(--bg)}
body.decorating .toasts{bottom:100px}
.deco-bar small{opacity:.7;display:block;font-size:11.5px}

/* ---------- 꾸미기 창 ---------- */
.theme-sw{display:flex;gap:10px;flex-wrap:wrap}
.theme-sw button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);width:46px}
.theme-sw i{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.theme-sw button.on{color:var(--ink);font-weight:700}
.theme-sw button.on i{box-shadow:0 0 0 2.5px var(--c)}
.bg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bg-grid button{aspect-ratio:4/3;border-radius:10px;border:2px solid var(--line);position:relative;overflow:hidden;font-size:11.5px;background-color:var(--surface2)}
.bg-grid button.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bg-grid button span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.42);color:#fff;padding:2px 0;font-weight:600}
.bg-grid .upload{display:grid;place-items:center;color:var(--muted);border-style:dashed;font-size:12px;line-height:1.3}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:2px}
.stk-grid button{font-size:26px;height:44px;border-radius:9px;transition:transform .1s}
.stk-grid button:hover{background:var(--surface2);transform:scale(1.15)}
input[type=range]{accent-color:var(--accent);width:100%}
.my-stk{display:flex;gap:6px;flex-wrap:wrap}
.my-stk button{width:46px;height:46px;border-radius:9px;border:1px solid var(--line);padding:4px;background:var(--surface2)}
.my-stk img{width:100%;height:100%;object-fit:contain}
.cf{position:fixed;z-index:95;pointer-events:none;font-size:18px;line-height:1}

/* ---------- 달력 날짜 스티커 ---------- */
.cal-day{position:relative}
.cal-stk{position:absolute;top:3px;right:4px;display:flex;flex-direction:row-reverse;pointer-events:none}
.cal-stk>*{font-size:27px;line-height:1;transform:rotate(-8deg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.cal-stk>*+*{margin-right:-12px;transform:rotate(7deg)}
.cal-stk img{width:34px;height:34px;object-fit:contain;display:block}
img.round{border-radius:50%;object-fit:cover!important;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}

const fmtShort = s => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); const hh = h % 12 === 0 ? 12 : h % 12; return `${h < 12 ? '오전' : '오후'} ${hh}:${pad(m)}`; };

function toast(msg, action) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;

/* ---------------- stores ---------------- */
const TASK_FIELDS = ['id','title','memo','category_id','due_date','due_time','important','remind_preset','remind_at','remind_done','pushed_at','repeat','done','done_at'];
const normTask = t => ({ ...t, due_time: t.due_time ? t.due_time.slice(0, 5) : null, memo: t.memo || '', repeat: t.repeat || 'none', remind_preset: t.remind_preset || 'none' });
const pickTask = t => Object.fromEntries(TASK_FIELDS.filter(k => k in t).map(k => [k, t[k] === '' && k !== 'memo' ? null : t[k]]));

const LocalStore = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('chg_' + k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem('chg_' + k, JSON.stringify(v)); },
  async init() {
    if (!this.get('cats', null)) {
      this.set('cats', DEFAULT_CATS.map((c, i) => ({ id: uuid(), ...c, sort: i })));
      const t = today();
      this.set('tasks', [
        { id: uuid(), title: '챙김 둘러보기 — 할 일을 눌러 수정해 보세요', memo: '', category_id: this.get('cats')[5].id, due_date: t, due_time: null, important: false, remind_preset: 'none', remind_at: null, remind_done: false, repeat: 'none', done: false },

      ]);

    return { email: '체험 모드 · 이 기기에만 저장' };
  },
  async listCats() { return this.get('cats', []).sort((a, b) => (a.sort ?? 0) - (b.sort ?? 0)); },
  async saveCat(c) { const a = this.get('cats', []); const i = a.findIndex(x => x.id === c.id); if (i >= 0) a[i] = { ...a[i], ...c }; else a.push({ ...c, id: c.id || uuid() }); this.set('cats', a); },
  async deleteCat(id) { this.set('cats', this.get('cats', []).filter(c => c.id !== id)); this.set('tasks', this.get('tasks', []).map(t => t.category_id === id ? { ...t, category_id: null } : t)); },
  async listTasks() { return this.get('tasks', []).map(normTask); },
  async saveTask(t) { const a = this.get('tasks', []); const row = { ...pickTask(t), updated_at: new Date().toISOString() }; if (!row.id) row.id = uuid(); const i = a.findIndex(x => x.id === row.id); if (i >= 0) a[i] = { ...a[i], ...row }; else a.push({ created_at: new Date().toISOString(), ...row }); this.set('tasks', a); return normTask(row); },
  async deleteTask(id) { this.set('tasks', this.get('tasks', []).filter(t => t.id !== id)); },
  async getSettings() { return { summary_time: '08:30', summary_enabled: true, ...this.get('settings', {}) }; },
  async saveSettings(s) { this.set('settings', { ...(await this.getSettings()), ...s }); },
  async savePushSub() { throw new Error('체험 모드에서는 폰 알림을 쓸 수 없어요. Supabase 연결 후 사용하세요.'); },

  subscribe() {},
  async signOut() {},
};

let sb = null, USER = null;
const SupaStore = {
  async listCats() { const { data, error } = await sb.from('chg_categories').select('*').order('sort').order('created_at'); if (error) throw error; return data; },
  async saveCat(c) { const row = { id: c.id || uuid(), name: c.name, color: c.color, sort: c.sort ?? 0 }; const { error } = await sb.from('chg_categories').upsert(row); if (error) throw error; },
  async deleteCat(id) { const { error } = await sb.from('chg_categories').delete().eq('id', id); if (error) throw error; },
  async listTasks() {
    const since = new Date(Date.now() - 90 * 86400000).toISOString();
    const { data, error } = await sb.from('chg_tasks').select('*').or(`done.eq.false,done_at.gte.${since}`).limit(3000);
    if (error) throw error; return data.map(normTask);
  },
  async saveTask(t) { const row = pickTask(t); if (!row.id) row.id = uuid(); const { data, error } = await sb.from('chg_tasks').upsert(row).select().single(); if (error) throw error; return normTask(data); },
  async deleteTask(id) { const { error } = await sb.from('chg_tasks').delete().eq('id', id); if (error) throw error; },
  async getSettings() {
    const { data } = await sb.from('chg_user_settings').select('*').eq('user_id', USER.id).maybeSingle();
    return { summary_time: '08:30', summary_enabled: true, ...(data || {}), summary_time: (data?.summary_time || '08:30').slice(0, 5) };
  },
  async saveSettings(s) {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Seoul';
    const { error } = await sb.from('chg_user_settings').upsert({ user_id: USER.id, timezone: tz, ...s }); if (error) throw error;
  },
  async savePushSub(sub) {
    const j = sub.toJSON();
    const { error } = await sb.from('chg_push_subscriptions').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent.slice(0, 200) }, { onConflict: 'endpoint' });
    if (error) throw error;
  },
  async removePushSub(endpoint) { await sb.from('chg_push_subscriptions').delete().eq('endpoint', endpoint); },
  subscribe(cb) {
    sb.channel('chg-' + USER.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'chg_tasks' }, cb)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'chg_categories' }, cb)
      .subscribe();
  },
  async signOut() { await sb.auth.signOut(); },
};
const store = DEMO ? LocalStore : SupaStore;

/* ---------------- state ---------------- */
const S = { view: 'today', cat: null, tasks: [], cats: [], settings: {}, calMonth: today().slice(0, 7), calSel: today(), day: today(), sideOpen: false };
const catOf = id => S.cats.find(c => c.id === id);
const colorOf = t => catOf(t.category_id)?.color || '#8D8D86';
const isOver = t => !t.done && t.due_date && (t.due_date < today() || (t.due_date === today() && t.due_time && t.due_time < nowHM()));

async function reload() {
  try {
    const [cats, tasks] = await Promise.all([store.listCats(), store.listTasks()]);
    S.cats = cats; S.tasks = tasks;
    if (S.cat && !catOf(S.cat)) S.cat = null;
    render(); checkAlerts();
  } catch (e) { console.error(e); toast('불러오기 실패: ' + (e.message || e)); }
}
let reloadTimer;
const reloadSoon = () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(reload, 400); };

/* ---------------- reminders & repeat ---------------- */
function computeRemind(t) {
  const p = t.remind_preset;
  if (!p || p === 'none') return null;
  if (p === 'custom') return t.remind_at || null;
  if (!t.due_date) return null;
  const base = parseYmd(t.due_date);
  const [h, m] = (t.due_time || '09:00').split(':').map(Number);
  base.setHours(h, m, 0, 0);
  const mins = { at: 0, '10m': 10, '30m': 30, '1h': 60 }[p];
  if (mins !== undefined) return new Date(base - mins * 60000).toISOString();
  if (p === '1d9' || p === '3d9') { const d = parseYmd(addDays(t.due_date, p === '1d9' ? -1 : -3)); d.setHours(9, 0, 0, 0); return d.toISOString(); }
  return null;
}
function nextDate(s, rep) {
  const d = parseYmd(s);
  if (rep === 'daily') d.setDate(d.getDate() + 1);
  else if (rep === 'weekdays') { do d.setDate(d.getDate() + 1); while (d.getDay() === 0 || d.getDay() === 6); }
  else if (rep === 'weekly') d.setDate(d.getDate() + 7);
  else if (rep === 'monthly') { const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); }
  return ymd(d);
}

async function saveTask(t, quiet) {
  const row = { ...t };
  if (row.remind_preset !== 'custom') row.remind_at = computeRemind(row);
  const prev = S.tasks.find(x => x.id === row.id);
  if (!prev || prev.remind_at !== row.remind_at) { row.remind_done = false; row.pushed_at = null; }
  const saved = await store.saveTask(row);
  const i = S.tasks.findIndex(x => x.id === saved.id);
  if (i >= 0) S.tasks[i] = { ...S.tasks[i], ...saved }; else S.tasks.push(saved);
  render(); checkAlerts();
  if (!quiet && row.remind_at && new Date(row.remind_at) < new Date() && !row.done && (!prev || prev.remind_at !== row.remind_at)) toast('알림 시각이 이미 지나서 곧 알림이 떠요');
  return saved;
}

async function toggleDone(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  if (!t.done && t.repeat && t.repeat !== 'none') {
    const base = t.due_date || today();
    const nd = nextDate(base, t.repeat);
    const upd = { ...t, due_date: nd };
    if (t.remind_preset === 'custom' && t.remind_at) upd.remind_at = new Date(new Date(t.remind_at).getTime() + diffDays(nd, base) * 86400000).toISOString();
    upd.remind_done = false; upd.pushed_at = null;
    await saveTask(upd, true);
    celebrate();
    toast(`반복 일정 — 다음은 ${fmtShort(nd)}`);
    return;
  }
  const done = !t.done;
  await saveTask({ ...t, done, done_at: done ? new Date().toISOString() : null, remind_done: done ? true : t.remind_done }, true);
  if (done) {
    const allDone = t.due_date && t.due_date <= today() && !S.tasks.some(x => !x.done && x.due_date && x.due_date <= today());
    celebrate(allDone);
    toast(allDone ? '오늘 할 일을 다 끝냈어요! 정말 수고했어요 🎉' : '완료했어요', { label: '되돌리기', fn: () => saveTask({ ...S.tasks.find(x => x.id === id), done: false, done_at: null }, true) });
  }
}

/* ---------------- shell render ---------------- */
function viewCounts() {
  const open = S.tasks.filter(t => !t.done && (!S.cat || t.category_id === S.cat));
  const td = today(), wk = addDays(td, 7);
  return {
    today: open.filter(t => t.due_date && t.due_date <= td).length,
    over: open.filter(t => t.due_date && t.due_date < td).length,
    upcoming: open.filter(t => t.due_date && t.due_date > td && t.due_date <= wk).length,
    all: open.length,
  };
}

function render() {
  if (!$('.shell')) renderShell();
  renderSide(); renderMain(); renderMobileNav();
}

function renderShell() {
  $('#app').innerHTML = `
    ${DEMO ? '<div class="demo-bar">체험 모드 — 이 기기에만 저장돼요. 폰 알림·동기화는 Supabase 연결 후 켜져요.</div>' : ''}
    <div class="shell">
      <aside class="side" id="side"></aside>
      <main class="main" id="main"></main>
    </div>
    <nav class="mnav" id="mnav"></nav>
    <button class="fab" id="fab" aria-label="새 할 일">${ICON.plus}</button>`;
  $('#fab').onclick = () => openEditor();
  $('#side').addEventListener('click', onSideClick);
  $('#main').addEventListener('click', onMainClick);
  $('#mnav').addEventListener('click', onSideClick);
}

function renderSide() {
  const c = viewCounts();
  const nav = (v, icon, label, n, red) => `<button class="nav-item ${S.view === v ? 'on' : ''}" data-view="${v}">${icon}<span>${label}</span>${n ? `<span class="cnt ${red ? 'red' : ''}">${n}</span>` : ''}</button>`;
  const catCount = id => S.tasks.filter(t => !t.done && t.category_id === id).length;
  $('#side').innerHTML = `
    <div class="brand"><img src="icons/icon-192.png" alt=""><div>챙김<small>${new Date().getMonth() + 1}월 ${new Date().getDate()}일 ${WD[new Date().getDay()]}요일</small></div></div>
    <button class="btn-new" data-act="new">${ICON.plus} 새 할 일</button>
    ${nav('today', ICON.sun, '오늘', c.today, c.over > 0)}
    ${nav('upcoming', ICON.week, '다가오는 7일', c.upcoming)}
    ${nav('calendar', ICON.cal, '달력')}
    ${nav('all', ICON.all, '전체', c.all)}
    ${nav('done', ICON.done, '완료됨')}
    <h4>카테고리 <button data-act="cats">관리</button></h4>
    ${S.cats.map(k => `<button class="nav-item ${S.cat === k.id ? 'on' : ''}" data-cat="${k.id}" style="--c:${k.color}"><span class="dot"></span><span>${esc(k.name)}</span><span class="cnt">${catCount(k.id) || ''}</span></button>`).join('')}
    <div class="foot">
      <button class="nav-item" data-act="summary">${ICON.sun}<span>오늘 요약 보기</span></button>
      <button class="nav-item" data-act="decor">${ICON.palette}<span>꾸미기</span></button>
      <button class="nav-item" data-act="settings">${ICON.gear}<span>설정</span></button>
      <div class="who">${esc(USER?.email || '')}</div>
    </div>`;
  $('#side').classList.toggle('open', S.sideOpen);
  document.querySelector('.scrim')?.remove();
  if (S.sideOpen) { const sc = document.createElement('div'); sc.className = 'scrim'; sc.onclick = () => { S.sideOpen = false; renderSide(); }; document.body.appendChild(sc); }
}

function renderMobileNav() {
  const b = (v, icon, label) => `<button class="${S.view === v ? 'on' : ''}" data-view="${v}">${icon}${label}</button>`;
  $('#mnav').innerHTML = `${b('today', ICON.sun, '오늘')}${b('upcoming', ICON.week, '7일')}${b('calendar', ICON.cal, '달력')}${b('all', ICON.all, '전체')}<button data-act="menu">${ICON.menu}메뉴</button>`;
}

function onSideClick(e) {
  const v = e.target.closest('[data-view]'), c = e.target.closest('[data-cat]'), a = e.target.closest('[data-act]');
  if (v) { S.view = v.dataset.view; S.sideOpen = false; render(); $('#main').scrollTop = 0; window.scrollTo(0, 0); }
  else if (c) { S.cat = S.cat === c.dataset.cat ? null : c.dataset.cat; S.sideOpen = false; render(); }
  else if (a) {
    const act = a.dataset.act; S.sideOpen = false;
    if (act === 'new') openEditor();
    else if (act === 'cats') openCatManager();
    else if (act === 'settings') openSettings();
    else if (act === 'summary') openSummary();
    else if (act === 'decor') openDecor();
    else if (act === 'menu') { S.sideOpen = true; renderSide(); return; }
    renderSide();
  }
}

/* ---------------- main views ---------------- */
const sortTasks = arr => arr.sort((a, b) =>
  (a.due_date || '9999').localeCompare(b.due_date || '9999') ||
  (b.important - a.important) ||
  (a.due_time || '99').localeCompare(b.due_time || '99') ||
  (a.created_at || '').localeCompare(b.created_at || ''));

function taskRow(t) {
  const cat = catOf(t.category_id);
  const over = isOver(t);
  const meta = [];
  if (cat) meta.push(`<span class="pill" style="--c:${cat.color}">${esc(cat.name)}</span>`);
  if (t.due_date && S.view !== 'calendar') meta.push(`<span class="${over ? 'over' : ''}">${relDate(t.due_date)}${t.due_time ? ' ' + fmtTime(t.due_time) : ''}</span>`);
  else if (t.due_time) meta.push(`<span class="${over ? 'over' : ''}">${ICON.clock}${fmtTime(t.due_time)}</span>`);
  if (t.remind_at && !t.done) meta.push(`<span title="알림">${ICON.bell}${fmtDT(t.remind_at)}</span>`);
  if (t.repeat && t.repeat !== 'none') meta.push(`<span>${ICON.rep}${REPEAT_LABEL[t.repeat]}</span>`);
  if (t.memo) meta.push(`<span title="메모 있음">${ICON.note}</span>`);
  return `<div class="task ${t.done ? 'done' : ''} ${t.important && !t.done ? 'imp' : ''}" data-id="${t.id}">
    <button class="check" style="--c:${cat?.color || '#8D8D86'}" data-act="toggle" aria-label="완료"></button>
    <div class="tbody" data-act="edit">
      <div class="ttitle">${t.important ? ICON.star : ''}${esc(t.title)}</div>
      ${meta.length ? `<div class="tmeta">${meta.join('')}</div>` : ''}
    </div></div>`;
}
const group = (title, list, cls = '') => list.length ? `<section class="group"><div class="group-h ${cls}">${title} <span class="n">${list.length}</span></div><div class="list">${list.map(taskRow).join('')}</div></section>` : '';

function quickBar(defDate) {
  const opts = S.cats.map(c => `<option value="${c.id}" ${(S.cat || '') === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const dsel = defDate !== undefined ? '' : `<select id="qDate"><option value="${today()}">오늘</option><option value="${addDays(today(), 1)}">내일</option><option value="">날짜 없음</option></select>`;
  return `<form class="quick" id="quick" data-date="${defDate ?? ''}">
    <input type="text" id="qTitle" placeholder="${defDate ? fmtDate(defDate) + '에 할 일 추가' : '할 일을 적고 Enter (알림·반복은 추가 후 눌러서)'}" autocomplete="off">
    <select id="qCat"><option value="">카테고리 없음</option>${opts}</select>
    ${dsel}
    <button class="go" type="submit">추가</button></form>`;
}

function mobileCats() {
  return `<div class="mcats"><button class="${!S.cat ? 'on' : ''}" data-cat="">전체</button>${S.cats.map(c => `<button class="${S.cat === c.id ? 'on' : ''}" data-cat="${c.id}" style="--c:${c.color}"><span class="dot"></span>${esc(c.name)}</button>`).join('')}</div>`;
}

function renderMain() {
  const td = today();
  const open = S.tasks.filter(t => !t.done && (!S.cat || t.category_id === S.cat));
  const catTag = S.cat ? `<span class="filter-tag"><span class="dot" style="--c:${catOf(S.cat)?.color}"></span>${esc(catOf(S.cat)?.name)} <button data-act="clearcat">${ICON.x}</button></span>` : '';
  let title = '', sub = '', body = '';

  if (S.view === 'today') {
    const tStk = stickersOn(td);
    title = '오늘' + (tStk.length ? `<span class="head-stk">${tStk.slice(0, 3).map(s => stkEl(s)).join('')}</span>` : '');
    sub = fmtDate(td) + (tStk.some(s => s.label) ? ` · 오늘은 <b style="color:var(--accent)">${tStk.filter(s => s.label).map(s => esc(s.label)).join(', ')}</b>` : '');
    const over = sortTasks(open.filter(t => t.due_date && t.due_date < td));
    const tod = sortTasks(open.filter(t => t.due_date === td));
    const doneToday = S.tasks.filter(t => t.done && t.done_at && ymd(new Date(t.done_at)) === td && (!S.cat || t.category_id === S.cat));
    body = quickBar() + group('밀린 일', over, 'red') + group('오늘 할 일', tod) +
      (!over.length && !tod.length ? `<div class="empty"><b>오늘 할 일이 비어 있어요</b>위 칸에 적으면 바로 추가돼요.</div>` : '') +
      (doneToday.length ? `<div style="height:14px"></div>` + group('오늘 완료', doneToday) : '');
  } else if (S.view === 'upcoming') {
    title = '다가오는 7일'; sub = `${fmtShort(addDays(td, 1))} ~ ${fmtShort(addDays(td, 7))}`;
    body = quickBar();
    let any = false;
    for (let i = 1; i <= 7; i++) { const d = addDays(td, i); const l = sortTasks(open.filter(t => t.due_date === d)); if (l.length) any = true; body += group(`${fmtDate(d)} · ${relDate(d)}${stkInline(d)}`, l); }
    if (!any) body += `<div class="empty"><b>일주일 안에 마감인 일이 없어요</b>여유 있는 한 주예요.</div>`;
  } else if (S.view === 'all') {
    title = '전체'; sub = `남은 일 ${open.length}개`;
    body = quickBar() + group('밀린 일', sortTasks(open.filter(t => t.due_date && t.due_date < td)), 'red');
    const dates = [...new Set(open.filter(t => t.due_date && t.due_date >= td).map(t => t.due_date))].sort();
    for (const d of dates) body += group(`${fmtDate(d)} · ${relDate(d)}${stkInline(d)}`, sortTasks(open.filter(t => t.due_date === d)));
    body += group('날짜 없음', sortTasks(open.filter(t => !t.due_date)));
    if (!open.length) body += `<div class="empty"><b>남은 일이 없어요</b>깔끔하네요.</div>`;
  } else if (S.view === 'done') {
    title = '완료됨'; sub = '최근 90일';
    const d = S.tasks.filter(t => t.done && (!S.cat || t.category_id === S.cat)).sort((a, b) => (b.done_at || '').localeCompare(a.done_at || ''));
    const byDay = {};
    d.forEach(t => { const k = t.done_at ? ymd(new Date(t.done_at)) : '날짜 없음'; (byDay[k] ||= []).push(t); });
    body = Object.entries(byDay).map(([k, l]) => group(k.includes('-') ? fmtDate(k) : k, l)).join('') || `<div class="empty"><b>아직 완료한 일이 없어요</b></div>`;
  } else if (S.view === 'calendar') {
    const [y, m] = S.calMonth.split('-').map(Number);
    title = `${y}년 ${m}월`;
    body = renderCalendar(y, m);
  }

  const calBar = S.view === 'calendar' ? `<div class="cal-bar"><button class="icon-btn" data-act="mprev">${ICON.left}</button><button class="txt-btn" data-act="mtoday">오늘</button><button class="icon-btn" data-act="mnext">${ICON.right}</button></div>` : '';
  $('#main').innerHTML = `<div class="main-inner">
    <div class="head"><div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div style="display:flex;gap:8px;align-items:center">${catTag}${calBar}</div></div>
    ${mobileCats()}${body}</div>`;
  const q = $('#quick');
  if (q) q.onsubmit = async e => {
    e.preventDefault();
    const title = $('#qTitle').value.trim(); if (!title) return;
    const due = q.dataset.date || ($('#qDate') ? $('#qDate').value : '');
    await saveTask({ title, memo: '', category_id: $('#qCat').value || null, due_date: due || null, due_time: null, important: false, remind_preset: 'none', repeat: 'none', done: false });
    $('#qTitle')?.focus();
  };
}

function renderCalendar(y, m) {
  const first = new Date(y, m - 1, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const td = today();
  const tasks = S.tasks.filter(t => t.due_date && (!S.cat || t.category_id === S.cat));
  const byDate = {};
  tasks.forEach(t => (byDate[t.due_date] ||= []).push(t));
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = ymd(d);
    if (i === 35 && d.getMonth() !== m - 1) break;
    const list = sortTasks((byDate[ds] || []).slice()).sort((a, b) => a.done - b.done);
    const cls = [d.getMonth() !== m - 1 && 'dim', ds === td && 'today', ds === S.calSel && 'sel', d.getDay() === 0 && 'sun', d.getDay() === 6 && 'sat'].filter(Boolean).join(' ');
    const dStk = stickersOn(ds), lbl = dStk.filter(s => s.label).map(s => s.label).join(', ');
    cells += `<div class="cal-day ${cls} ${dStk.length ? 'has-stk' : ''}" data-date="${ds}" ${lbl ? `title="${esc(lbl)}"` : ''}><span class="num">${d.getDate()}</span>
      ${dStk.length ? `<div class="cal-stk">${dStk.slice(0, 2).map(s => stkEl(s)).join('')}</div>` : ''}
      ${lbl ? `<div class="cal-lbl">${esc(lbl)}</div>` : ''}
      ${list.slice(0, 3).map(t => `<div class="chip ${t.done ? 'done' : ''} ${t.important ? 'imp' : ''}" style="--c:${colorOf(t)}">${t.due_time ? t.due_time + ' ' : ''}${esc(t.title)}</div>`).join('')}
      ${list.length > 3 ? `<div class="more">+${list.length - 3}개 더</div>` : ''}
      <div class="dots">${list.slice(0, 4).map(t => `<i style="--c:${colorOf(t)};${t.done ? 'opacity:.35' : ''}"></i>`).join('')}</div></div>`;
  }
  const sel = sortTasks(S.tasks.filter(t => t.due_date === S.calSel && (!S.cat || t.category_id === S.cat)));
  return `<div class="cal"><div class="cal-grid">${WD.map(w => `<div class="cal-wd">${w}</div>`).join('')}${cells}</div></div>
    <div class="day-panel"><div class="group-h" style="font-size:15px;color:var(--ink)">${fmtDate(S.calSel)} · ${relDate(S.calSel)}</div>
    <div class="day-stk">${stickersOn(S.calSel).map(s => `<span class="ds">${stkEl(s)}${s.label ? `<span>${esc(s.label)}</span>` : ''}${s.yearly ? '<small>매년</small>' : ''}<button data-act="dsdel" data-sid="${s.id}" title="떼기">×</button></span>`).join('')}<button class="ds-add" data-act="dsadd">🐾 이 날에 스티커 붙이기</button></div>
    ${quickBar(S.calSel)}
    ${sel.length ? `<div class="list">${sel.map(taskRow).join('')}</div>` : `<div class="empty">이 날은 일정이 없어요</div>`}</div>`;
}

function onMainClick(e) {
  const act = e.target.closest('[data-act]')?.dataset.act;
  const tEl = e.target.closest('.task');
  const day = e.target.closest('.cal-day');
  const cat = e.target.closest('.mcats [data-cat]');
  if (cat) { S.cat = cat.dataset.cat || null; render(); return; }
  if (act === 'toggle' && tEl) return toggleDone(tEl.dataset.id);
  if (act === 'edit' && tEl) return openEditor(S.tasks.find(t => t.id === tEl.dataset.id));
  if (act === 'clearcat') { S.cat = null; return render(); }
  if (act === 'mprev' || act === 'mnext') { const [y, m] = S.calMonth.split('-').map(Number); const d = new Date(y, m - 1 + (act === 'mnext' ? 1 : -1), 1); S.calMonth = ymd(d).slice(0, 7); return render(); }
  if (act === 'mtoday') { S.calMonth = today().slice(0, 7); S.calSel = today(); return render(); }
  if (act === 'dsadd') return openDateSticker(S.calSel);
  if (act === 'dsdel') { const sid = e.target.closest('[data-sid]').dataset.sid; if (confirm('이 스티커를 뗄까요?')) removeDateSticker(sid); return; }
  if (day) {
    if (S.calSel === day.dataset.date && e.detail >= 2) return openEditor(null, { due_date: day.dataset.date });
    S.calSel = day.dataset.date; renderMain();
    if (matchMedia('(max-width:760px)').matches) $('.day-panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

/* ---------------- modals ---------------- */
function modal(html, opts = {}) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'modal';
  ov.innerHTML = `<div class="modal" style="${opts.width ? `width:min(${opts.width}px,100%)` : ''}">${html}</div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
  return ov;
}
const closeModal = () => $('#modal')?.remove();

function openEditor(task, defaults = {}) {
  const isNew = !task;
  const t = task ? { ...task } : { title: '', memo: '', category_id: S.cat || null, due_date: S.view === 'calendar' ? S.calSel : today(), due_time: null, important: false, remind_preset: 'none', remind_at: null, repeat: 'none', done: false, ...defaults };
  const ov = modal(`
    <div class="modal-h"><h2>${isNew ? '새 할 일' : '할 일 수정'}</h2><button class="icon-btn" data-x>${ICON.x}</button></div>
    <div class="modal-b">
      <input class="inp title-inp" id="eTitle" placeholder="무엇을 해야 하나요?" value="${esc(t.title)}">

/* ---------------- alerts ---------------- */
let lastAlertKey = '';
const dueAlerts = () => { const n = Date.now(); return S.tasks.filter(t => !t.done && t.remind_at && !t.remind_done && new Date(t.remind_at).getTime() <= n).sort((a, b) => a.remind_at.localeCompare(b.remind_at)); };
const alertPayload = t => ({ id: t.id, title: t.title, important: !!t.important, color: colorOf(t), category: catOf(t.category_id)?.name || '', when: t.due_date ? `${relDate(t.due_date)}${t.due_time ? ' ' + fmtTime(t.due_time) : ''}` : '', over: isOver(t), memo: t.memo || '' });

function checkAlerts() {
  const due = dueAlerts();
  if (IS_DESKTOP) { window.desktop.syncAlerts(due.map(alertPayload)); return; }
  const key = due.map(t => t.id).join(',');
  document.title = due.length ? `⏰ (${due.length}) 챙김` : '챙김';
  if (key === lastAlertKey && $('#alertOv')) return;
  const isNew = due.some(t => !lastAlertKey.includes(t.id));
  lastAlertKey = key;
  $('#alertOv')?.remove();
  if (!due.length) return;
  const ov = document.createElement('div');
  ov.className = 'alert-ov'; ov.id = 'alertOv';
  ov.innerHTML = `<div class="alert"><div class="alert-top">${ICON.bellBig}<div><b>잊지 마세요!</b><small>${due.length}개의 알림</small></div></div>
    ${due.map(alertPayload).map(a => `<div class="alert-item" data-id="${a.id}"><div class="t">${a.important ? ICON.star : ''}<span class="dot" style="--c:${a.color}"></span>${esc(a.title)}</div>
      <div class="m">${a.category ? `<span>${esc(a.category)}</span>` : ''}${a.when ? `<span style="${a.over ? 'color:var(--danger);font-weight:600' : ''}">${a.when}</span>` : ''}${a.memo ? `<span>${esc(a.memo.slice(0, 60))}</span>` : ''}</div>
      <div class="alert-acts"><button class="btn sm primary" data-a="done">완료</button><button class="btn sm" data-a="s10">10분 뒤</button><button class="btn sm" data-a="s60">1시간 뒤</button><button class="btn sm" data-a="tmr">내일 9시</button><button class="btn sm" data-a="ack">확인</button></div></div>`).join('')}</div>`;
  ov.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) alertAction(b.closest('[data-id]').dataset.id, b.dataset.a); });
  document.body.appendChild(ov);
  if (isNew) chime();
}

async function alertAction(id, a) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  if (a === 'done') { if (t.repeat && t.repeat !== 'none') await toggleDone(id); else { await saveTask({ ...t, done: true, done_at: new Date().toISOString(), remind_done: true }, true); celebrate(); } toast('완료했어요'); return; }
  if (a === 'ack') { await saveTask({ ...t, remind_done: true }, true); return; }
  let at;
  if (a === 's10') at = new Date(Date.now() + 10 * 60000);
  else if (a === 's60') at = new Date(Date.now() + 60 * 60000);
  else if (a === 'tmr') { at = parseYmd(addDays(today(), 1)); at.setHours(9, 0, 0, 0); }
  await saveTask({ ...t, remind_preset: 'custom', remind_at: at.toISOString(), remind_done: false, pushed_at: null }, true);
  toast(`${fmtDT(at.toISOString())}에 다시 알려드릴게요`);
}

function chime() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, .18, .36].forEach((d, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = [880, 1175, 1568][i]; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.0001, ac.currentTime + d); g.gain.exponentialRampToValueAtTime(.25, ac.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d + .35); o.start(ac.currentTime + d); o.stop(ac.currentTime + d + .4); });
  } catch {}
}

/* ---------------- push ---------------- */
const b64ToU8 = b => { const p = '='.repeat((4 - b.length % 4) % 4); const r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
const pushSupported = () => !IS_DESKTOP && 'serviceWorker' in navigator && 'PushManager' in window && location.protocol === 'https:';
async function pushStatus() {
  if (IS_DESKTOP) return 'desktop';
  if (!pushSupported()) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  return sub ? 'on' : 'off';
}
async function enablePush() {
  if (DEMO) throw new Error('체험 모드에서는 폰 알림을 쓸 수 없어요');
  if (CONFIG.VAPID_PUBLIC_KEY.includes('YOUR-')) throw new Error('VAPID 공개키가 설정되지 않았어요 (안내서 3단계)');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('알림 권한이 거부됐어요. 브라우저 사이트 설정에서 허용해 주세요.');
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(CONFIG.VAPID_PUBLIC_KEY) });
  await store.savePushSub(sub);
}
async function disablePush() {
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  if (sub) { await store.removePushSub(sub.endpoint); await sub.unsubscribe(); }
}

(function stickerDrag() {
  const layer = $('#stickers'); let drag = null;
  const find = id => DECOR.stickers.find(s => s.id === id);
  layer.addEventListener('pointerdown', e => {
    if (!document.body.classList.contains('decorating')) return;
    const el = e.target.closest('.stk'); if (!el) return;
    const s = find(el.dataset.sid); if (!s) return;
    if (e.target.closest('.del')) { DECOR.stickers = DECOR.stickers.filter(x => x !== s); saveDecor(); renderStickers(); return; }
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const rc = el.getBoundingClientRect(), cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2;
    drag = e.target.closest('.rsz')
      ? { el, s, mode: 'size', cx, cy, d0: Math.hypot(e.clientX - cx, e.clientY - cy) || 1, s0: s.s }
      : { el, s, mode: 'move', dx: e.clientX - cx, dy: e.clientY - cy };
    DECOR.stickers = DECOR.stickers.filter(x => x !== s).concat(s); // 잡은 스티커를 맨 위로
    layer.appendChild(el);
  });
  layer.addEventListener('pointermove', e => {
    if (!drag) return;
    const { el, s } = drag;
    if (drag.mode === 'move') {
      s.x = Math.min(98, Math.max(2, (e.clientX - drag.dx) / innerWidth * 100));
      s.y = Math.min(98, Math.max(2, (e.clientY - drag.dy) / innerHeight * 100));
      el.style.left = s.x + '%'; el.style.top = s.y + '%';
    } else {
      s.s = Math.round(Math.min(420, Math.max(22, drag.s0 * Math.hypot(e.clientX - drag.cx, e.clientY - drag.cy) / drag.d0)));
      el.style[s.t === 'i' ? 'width' : 'fontSize'] = s.s + 'px';
    }
  });
  const end = () => { if (drag) { drag = null; saveDecor(); } };
  layer.addEventListener('pointerup', end); layer.addEventListener('pointercancel', end);
  layer.addEventListener('wheel', e => {
    if (!document.body.classList.contains('decorating')) return;
    const el = e.target.closest('.stk'); if (!el) return;
    e.preventDefault();
    const s = find(el.dataset.sid);
    if (e.shiftKey) { s.r = ((s.r || 0) + (e.deltaY > 0 ? 6 : -6)) % 360; el.style.setProperty('--r', s.r + 'deg'); }
    else { s.s = Math.round(Math.min(420, Math.max(22, s.s * (e.deltaY > 0 ? 0.9 : 1.1)))); el.style[s.t === 'i' ? 'width' : 'fontSize'] = s.s + 'px'; }
    clearTimeout(el._t); el._t = setTimeout(saveDecor, 300);
  }, { passive: false });
})();

async function shrinkImage(file, max, type, q, square) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('이미지를 열 수 없어요')); i.src = url; });
    const side = Math.min(img.width, img.height);
    const sx = square ? (img.width - side) / 2 : 0, sy = square ? (img.height - side) / 2 : 0;
    const sw = square ? side : img.width, sh = square ? side : img.height;
    const k = Math.min(1, max / Math.max(sw, sh));
    const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
    c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return c.toDataURL(type, q);
  } finally { URL.revokeObjectURL(url); }
}

function celebrate(big) {
  if (DECOR.confetti === false) return;
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2F5D50';
  const colors = [accent, '#FF8FAB', '#FFC93C', '#6BCB77', '#4D96FF', '#B892FF'];
  const n = big ? 70 : 26, x0 = big ? innerWidth / 2 : lastPt.x, y0 = big ? innerHeight * 0.45 : lastPt.y;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('span'); el.className = 'cf';
    if (i % 5 === 0) el.textContent = ['✨', '💖', '⭐', '🎉', '🌸'][i % 25 / 5 | 0];
    else Object.assign(el.style, { width: '8px', height: '11px', borderRadius: '2px', background: colors[i % colors.length] });
    el.style.left = x0 + 'px'; el.style.top = y0 + 'px';
    document.body.appendChild(el);
    const ang = Math.random() * Math.PI * 2, dist = (big ? 180 : 70) + Math.random() * (big ? 260 : 90);
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist + (big ? 220 : 90);
    el.animate([{ transform: 'translate(-50%,-50%) scale(.6)', opacity: 1 }, { transform: `translate(${dx}px,${dy}px) rotate(${Math.random() * 720 - 360}deg) scale(1)`, opacity: 0 }],
      { duration: (big ? 1400 : 850) + Math.random() * 500, easing: 'cubic-bezier(.15,.7,.3,1)' }).onfinish = () => el.remove();
  }
}

      </div>
      <div class="box" id="dStkBox"><h3>화면 스티커</h3>
        <div class="hint">모니터에 붙인 것처럼 화면에 고정돼요 (스크롤해도 그 자리). <b>날짜에 붙이려면</b> 달력에서 날짜를 누르고 '🐾 이 날에 스티커 붙이기'를 누르세요.</div>
        <div class="stk-grid" id="dStk">${STICKER_EMOJI.map(e => `<button data-v="${e}">${e}</button>`).join('')}</div>
        <span class="lbl" style="margin:4px 0 0">내 이미지 스티커</span>
        <div class="my-stk" id="dMy">${DECOR.myStickers.map((s, i) => `<button data-i="${i}" title="붙이기">${`<img src="${s}" alt="">`}</button>`).join('')}<button id="dMyAdd" title="이미지 추가" style="font-size:20px;color:var(--muted)">＋</button></div>
        <input type="file" id="dMyFile" accept="image/*" class="hidden">
        <div class="hint">배경이 투명한 PNG(캐릭터, 짤 등)를 넣으면 진짜 스티커처럼 보여요.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm primary" id="dEdit" ${DECOR.stickers.length ? '' : 'disabled'}>붙인 스티커 옮기기·떼기 (${DECOR.stickers.length})</button>
          ${DECOR.stickers.length ? '<button class="btn sm danger" id="dClear">모두 떼기</button>' : ''}
        </div>
      </div>
      <div class="box"><h3>기분 좋은 효과</h3>
        <label class="toggle"><input type="checkbox" id="dConf" ${DECOR.confetti !== false ? 'checked' : ''}><span class="sw"></span><span>할 일 완료하면 꽃가루 🎉</span></label>
      </div>
      <div class="hint">꾸미기는 기기마다 따로 저장돼요 (PC 따로, 폰 따로). 백업 파일에는 함께 들어가요.</div>
    </div>
    <div class="modal-f"><button class="btn" id="dReset">처음 모습으로</button><span class="sp"></span><button class="btn primary" data-x>완료</button></div>`, { width: 560 });
  const reopen = sec => { openDecor(sec); };
  ov.querySelectorAll('[data-x]').forEach(b => b.onclick = closeModal);
  ov.querySelector('#dTheme').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; DECOR.theme = b.dataset.v; saveDecor(); applyDecor(); ov.querySelectorAll('#dTheme button').forEach(x => x.classList.toggle('on', x === b)); };
  const bgFile = ov.querySelector('#dBgFile');
  ov.querySelector('#dBg').onclick = e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    if (b.dataset.v === 'image' && !DECOR.bgImage) { bgFile.click(); return; }
    DECOR.bg = b.dataset.v; saveDecor(); applyDecor(); ov.querySelectorAll('#dBg button').forEach(x => x.classList.toggle('on', x === b));
  };
  const chg = ov.querySelector('#dBgChange'); if (chg) chg.onclick = () => bgFile.click();
  bgFile.onchange = async () => {
    const f = bgFile.files[0]; if (!f) return;
    try {
      const prev = { ...DECOR };
      DECOR.bgImage = await shrinkImage(f, 1920, 'image/jpeg', 0.82); DECOR.bg = 'image';
      if (DECOR.dim < 0.2) DECOR.dim = 0.25;
      if (!saveDecor()) { DECOR = prev; return; }
      applyDecor(); reopen();
    } catch (err) { toast(err.message); }
  };
  ov.querySelector('#dDim').oninput = e => { DECOR.dim = +e.target.value; applyDecor(); };
  ov.querySelector('#dDim').onchange = saveDecor;
  ov.querySelector('#dStk').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; addSticker('e', b.dataset.v); closeModal(); setDecorating(true); toast('붙였어요! 끌어서 원하는 곳에 두세요'); };
  const myFile = ov.querySelector('#dMyFile');
  ov.querySelector('#dMy').onclick = e => {
    if (e.target.closest('#dMyAdd')) { myFile.click(); return; }
    const b = e.target.closest('[data-i]'); if (!b) return;
    addSticker('i', DECOR.myStickers[+b.dataset.i]); closeModal(); setDecorating(true);
  };
  ov.querySelector('#dMy').oncontextmenu = e => {
    const b = e.target.closest('[data-i]'); if (!b) return; e.preventDefault();
    if (confirm('이 이미지를 목록에서 지울까요? (이미 붙인 스티커는 그대로예요)')) { DECOR.myStickers.splice(+b.dataset.i, 1); saveDecor(); reopen('stickers'); }
  };
  myFile.onchange = async () => {
    const f = myFile.files[0]; if (!f) return;
    try {
      const data = await shrinkImage(f, 360, 'image/webp', 0.9);
      DECOR.myStickers.push(data);
      if (!saveDecor()) { DECOR.myStickers.pop(); return; }
      addSticker('i', data); closeModal(); setDecorating(true); toast('내 스티커를 붙였어요! 끌어서 옮겨 보세요');
    } catch (err) { toast(err.message); }
  };
  const ed = ov.querySelector('#dEdit'); if (ed) ed.onclick = () => { closeModal(); setDecorating(true); };
  const cl = ov.querySelector('#dClear'); if (cl) cl.onclick = () => { if (confirm('붙인 스티커를 모두 뗄까요?')) { DECOR.stickers = []; saveDecor(); renderStickers(); reopen('stickers'); } };
  ov.querySelector('#dConf').onchange = e => { DECOR.confetti = e.target.checked; saveDecor(); if (e.target.checked) celebrate(); };
  ov.querySelector('#dReset').onclick = () => {
    if (!confirm('테마·배경·화면 스티커를 처음 모습으로 돌릴까요? (달력 날짜 스티커와 내 이미지 목록은 남겨둬요)')) return;
    DECOR = { ...decorDefault(), myStickers: DECOR.myStickers, dateStickers: DECOR.dateStickers }; saveDecor(); applyDecor(); render(); reopen();
  };
  if (scrollTo === 'stickers') setTimeout(() => ov.querySelector('#dStkBox')?.scrollIntoView({ block: 'start' }), 30);
}

/* ---------------- login ---------------- */
function renderLogin(msg = '') {
  let mode = 'in';
  $('#app').innerHTML = `<div class="login"><form class="card" id="lf">
    <h1><img src="icons/icon-192.png" alt="">챙김</h1>
    <div class="hint">할 일·일정·알림을 한곳에서. 회사와 상관없는 개인 계정이라 어디로 가든 그대로예요.</div>
    <input class="inp" type="email" id="lEmail" placeholder="이메일" autocomplete="email" required>
    <input class="inp" type="password" id="lPw" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" required minlength="6">
    <div class="err" id="lErr">${esc(msg)}</div>
    <button class="btn primary" type="submit" id="lGo">로그인</button>
    <button class="btn" type="button" id="lMode">처음이에요 — 계정 만들기</button></form></div>`;
  $('#lMode').onclick = () => { mode = mode === 'in' ? 'up' : 'in'; $('#lGo').textContent = mode === 'in' ? '로그인' : '계정 만들기'; $('#lMode').textContent = mode === 'in' ? '처음이에요 — 계정 만들기' : '이미 계정이 있어요 — 로그인'; };
  $('#lf').onsubmit = async e => {
    e.preventDefault(); $('#lErr').textContent = ''; $('#lGo').disabled = true;
    const email = $('#lEmail').value.trim(), password = $('#lPw').value;
    const { data, error } = mode === 'in' ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
    $('#lGo').disabled = false;
    if (error) { $('#lErr').textContent = error.message.includes('Invalid login') ? '이메일 또는 비밀번호가 맞지 않아요' : error.message; return; }
    if (!data.session) { $('#lErr').textContent = '확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인하세요.'; return; }
    start(data.session.user);
  };
}

/* ---------------- boot ---------------- */
let started = false;
async function start(user) {
  if (started) return; started = true;
  USER = user;
  $('#app').innerHTML = '';
  if (!DEMO) {
    const cats = await store.listCats().catch(() => []);
    if (!cats.length) for (const [i, c] of DEFAULT_CATS.entries()) await store.saveCat({ ...c, sort: i });
  }
  S.settings = await store.getSettings().catch(() => ({ summary_time: '08:30', summary_enabled: true }));
  await reload();
  store.subscribe(reloadSoon);
  setInterval(tick, 20000);
  setInterval(reload, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) reload(); });
  maybeSummary();
  const qid = new URLSearchParams(location.search).get('task');
  if (qid) { const t = S.tasks.find(x => x.id === qid); if (t) openEditor(t); history.replaceState(null, '', location.pathname); }
  if (IS_DESKTOP) {
    window.desktop.onAlertAction(({ id, action }) => alertAction(id, action));
    window.desktop.onShowSummary(() => openSummary());
    window.desktop.onOpenTask(id => { const t = S.tasks.find(x => x.id === id); if (t) openEditor(t); });
  }
}
function tick() {
  if (S.day !== today()) { S.day = today(); S.calSel = today(); render(); }
  else if (S.view === 'today') renderMain();
  checkAlerts(); maybeSummary();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal')) closeModal();
  else if (e.key === 'Escape' && document.body.classList.contains('decorating')) setDecorating(false);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n' && USER) { e.preventDefault(); openEditor(); }
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(console.warn);
  navigator.serviceWorker.addEventListener('message', e => { if (e.data?.type === 'open-task') { const t = S.tasks.find(x => x.id === e.data.id); if (t) openEditor(t); } });
}

(async () => {
  applyDecor();
  if (DEMO) { start(await LocalStore.init()); return; }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session.user); else renderLogin();
  sb.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_OUT') { started = false; renderLogin(); } else if (ev === 'SIGNED_IN' && s && !started) start(s.user); });
})();
</script>
